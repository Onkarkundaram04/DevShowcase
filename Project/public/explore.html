<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore developer projects, AI models, repositories, and live builds on DevShowcase.">
    <title>Explore Projects & Builds — DevShowcase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </span>
            <span>Dev<span class="brand-gradient-text">Showcase</span></span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="explore.html" class="nav-link active">Explore</a></li>
        </ul>
    </nav>

    <!-- Main Community Feed -->
    <main class="container">
        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Explore Projects & Builds</h1>
                    <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 2px;">Discover open-source repos, AI models, and live demos shared by developers.</p>
                </div>
                <a href="post.html" class="btn btn-primary">+ Share Project</a>
            </div>
            
            <div id="post-container">
                <div class="card" style="text-align: center; padding: 36px 20px; color: var(--text-muted);">
                    <p>Loading community projects...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/explore.js"></script>
</body>
</html>
