<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — DevShowcase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </span>
            <span>Dev<span class="brand-gradient-text">Showcase</span></span>
        </a>
        <a href="explore.html" class="nav-link">← Back to Explore</a>
    </nav>

    <!-- Auth Card -->
    <main class="container-auth">
        <div class="card">
            <div style="text-align: center; margin-bottom: 24px;">
                <h1 class="card-title" style="font-size: 1.6rem;">Welcome Back</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Sign in to showcase your latest builds and connect.</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="developer@example.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password-btn" data-target="login-password" aria-label="Show password">
                            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="auth-footer">
                New to DevShowcase? <a href="register.html">Create an account</a>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
